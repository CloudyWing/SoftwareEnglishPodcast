name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要重新生成音訊的 tag（如 v1.0.0）'
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  prepare-release:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.context.outputs.tag }}

    steps:
      - name: Resolve release context
        id: context
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$DISPATCH_TAG"
          else
            TAG="$GITHUB_REF_NAME"
          fi

          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must match vMAJOR.MINOR.PATCH. Received: $TAG" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.context.outputs.tag }}

      - name: Extract Release Notes from CHANGELOG
        id: extract
        env:
          TAG: ${{ steps.context.outputs.tag }}
          CHANGELOG: CHANGELOG.md
        run: |
          set -euo pipefail

          if [ ! -f "$CHANGELOG" ]; then
            echo "use_generate_notes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ESCAPED_TAG=$(printf '%s\n' "$TAG" | sed 's/\./\\./g')
          NOTES=$(awk "/^## ${ESCAPED_TAG}( |\r?\$)/{found=1} found && /^## / && !/^## ${ESCAPED_TAG}/{exit} found{print}" "$CHANGELOG" | sed 's/^#//')

          if [ -z "$(printf '%s' "$NOTES" | tr -d ' \n\r')" ]; then
            echo "use_generate_notes=true" >> "$GITHUB_OUTPUT"
          else
            printf "%s\n" "$NOTES" > /tmp/release_notes.md
            echo "use_generate_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.context.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi

          if [ "${{ steps.extract.outputs.use_generate_notes }}" = "true" ]; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          else
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/release_notes.md
          fi

  generate-audio:
    needs: [prepare-release]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Detect changed transcripts
        id: changed
        run: |
          set -euo pipefail

          CURRENT_TAG="${{ needs.prepare-release.outputs.tag }}"
          VERSION_TAGS=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          PREV_TAG=$(printf '%s\n' "$VERSION_TAGS" | grep -Fvx "$CURRENT_TAG" | head -n 1 || true)

          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found. Converting all transcripts." >&2
            find transcripts -name "*.xml" | sort > /tmp/changed_files.txt
          else
            echo "Comparing ${PREV_TAG}..${CURRENT_TAG}" >&2
            git diff --name-only --diff-filter=ACMR "${PREV_TAG}..${CURRENT_TAG}" -- 'transcripts/*.xml' > /tmp/changed_files.txt
          fi

          if [ -s /tmp/changed_files.txt ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

          echo "previous_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"

      - name: Validate release inputs
        if: steps.changed.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          TTS_KEY: ${{ secrets.TTS_KEY }}
          TTS_REGION: ${{ secrets.TTS_REGION }}
        run: |
          set -euo pipefail

          HAS_MISSING=false

          if [ -z "$TTS_KEY" ]; then
            echo "Missing required secret: TTS_KEY" >&2
            HAS_MISSING=true
          fi

          if [ -z "$TTS_REGION" ]; then
            echo "Missing required secret: TTS_REGION" >&2
            HAS_MISSING=true
          fi

          if [ "$HAS_MISSING" = true ]; then
            exit 1
          fi

          gh release view "$TAG" > /dev/null

      - name: Convert transcripts to MP3
        if: steps.changed.outputs.has_changes == 'true'
        id: convert
        env:
          TTS_KEY: ${{ secrets.TTS_KEY }}
          TTS_REGION: ${{ secrets.TTS_REGION }}
        run: |
          set -euo pipefail

          MAX_RETRY=3
          mkdir -p release-assets
          > /tmp/success_list.txt
          > /tmp/failed_list.txt

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue

            if [ ! -f "$FILE" ]; then
              echo "File $FILE does not exist, skipping..."
              continue
            fi

            ATTEMPT=0
            SUCCESS=false
            OUTPUT_FILE="release-assets/$(basename "${FILE%.xml}.mp3")"

            while [ $ATTEMPT -lt $MAX_RETRY ]; do
              ATTEMPT=$((ATTEMPT + 1))
              echo "Converting $FILE (attempt $ATTEMPT/$MAX_RETRY)..."

              if pwsh scripts/Convert-Podcast.ps1 \
                -InputFile "$FILE" \
                -ApiKey "$TTS_KEY" \
                -Region "$TTS_REGION" \
                -OutputFile "$OUTPUT_FILE"; then
                SUCCESS=true
                echo "$OUTPUT_FILE" >> /tmp/success_list.txt
                break
              fi

              echo "Retry $ATTEMPT/$MAX_RETRY for $FILE"
              sleep 5
            done

            if [ "$SUCCESS" = false ]; then
              echo "$FILE" >> /tmp/failed_list.txt
            fi
          done < /tmp/changed_files.txt

          if [ -s /tmp/success_list.txt ]; then
            echo "has_success=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_success=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -s /tmp/failed_list.txt ]; then
            echo "has_failures=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_failures=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report failures
        if: steps.convert.outputs.has_failures == 'true'
        run: |
          echo "❌ The following files failed to convert after 3 retries:"
          cat /tmp/failed_list.txt
          exit 1

      - name: Assemble complete MP3 release assets
        if: steps.changed.outputs.has_changes == 'false' || (steps.convert.outputs.has_success == 'true' && steps.convert.outputs.has_failures != 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.changed.outputs.previous_tag }}
        run: |
          set -euo pipefail

          ARCHIVE_DIR="archive-mp3"
          DOWNLOAD_DIR="previous-release-assets"
          PREVIOUS_ARCHIVE_DIR="previous-release-archive"
          ARCHIVE_FILE="software-english-podcast-${TAG}-mp3.zip"

          rm -rf "$ARCHIVE_DIR" "$DOWNLOAD_DIR" "$PREVIOUS_ARCHIVE_DIR"
          mkdir -p "$ARCHIVE_DIR" "$DOWNLOAD_DIR" "$PREVIOUS_ARCHIVE_DIR" release-assets

          if [ -n "$PREVIOUS_TAG" ]; then
            gh release download "$PREVIOUS_TAG" --pattern "*.mp3" --dir "$DOWNLOAD_DIR" || true
            gh release download "$PREVIOUS_TAG" --pattern "software-english-podcast-${PREVIOUS_TAG}-mp3.zip" --dir "$DOWNLOAD_DIR" || true

            PREVIOUS_ARCHIVE="$DOWNLOAD_DIR/software-english-podcast-${PREVIOUS_TAG}-mp3.zip"
            if [ -f "$PREVIOUS_ARCHIVE" ]; then
              python3 - "$PREVIOUS_ARCHIVE" "$PREVIOUS_ARCHIVE_DIR" <<'PY'
          import sys
          from pathlib import Path
          from zipfile import ZipFile

          archive_file = Path(sys.argv[1])
          output_dir = Path(sys.argv[2])

          with ZipFile(archive_file) as zip_file:
              zip_file.extractall(output_dir)
          PY
            fi
          fi

          for SOURCE_DIR in "$DOWNLOAD_DIR" "$PREVIOUS_ARCHIVE_DIR" release-assets; do
            [ -d "$SOURCE_DIR" ] || continue

            find "$SOURCE_DIR" -type f -name "*.mp3" -print0 | while IFS= read -r -d '' MP3; do
              BASENAME="$(basename "$MP3")"
              if [[ "$BASENAME" =~ ^Episode[.\ ]([0-9]{2})[.\ ] ]]; then
                EPISODE_NUMBER="${BASH_REMATCH[1]}"
                TRANSCRIPT="$(find transcripts -maxdepth 1 -type f -name "Episode ${EPISODE_NUMBER} - *.xml" | head -n 1)"

                if [ -n "$TRANSCRIPT" ]; then
                  TARGET_NAME="$(basename "${TRANSCRIPT%.xml}.mp3")"
                else
                  TARGET_NAME="$BASENAME"
                fi
              else
                TARGET_NAME="$BASENAME"
              fi

              cp "$MP3" "$ARCHIVE_DIR/$TARGET_NAME"
            done
          done

          while IFS= read -r TRANSCRIPT; do
            TARGET_MP3="$ARCHIVE_DIR/$(basename "${TRANSCRIPT%.xml}.mp3")"

            if [ ! -f "$TARGET_MP3" ]; then
              echo "Missing MP3 for transcript: $TRANSCRIPT" >&2
              exit 1
            fi
          done < <(find transcripts -maxdepth 1 -type f -name "Episode *.xml" | sort)

          python3 - "$ARCHIVE_FILE" <<'PY'
          import sys
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          archive_dir = Path("archive-mp3")
          archive_file = Path(sys.argv[1])

          with ZipFile(archive_file, "w", compression=ZIP_DEFLATED) as zip_file:
              for mp3 in sorted(archive_dir.glob("*.mp3")):
                  zip_file.write(mp3, arcname=mp3.name)
          PY

          find "$ARCHIVE_DIR" -maxdepth 1 -type f -name "*.mp3" -print0 | sort -z | while IFS= read -r -d '' MP3; do
            LABEL="$(basename "$MP3")"
            echo "Uploading $LABEL..."
            gh release upload "$TAG" "$MP3#$LABEL" --clobber
          done

          gh release upload "$TAG" "$ARCHIVE_FILE#Software English Podcast ${TAG} MP3.zip" --clobber

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build podcast feed
        env:
          FEED_OWNER_EMAIL: ${{ vars.FEED_OWNER_EMAIL }}
        run: |
          set -euo pipefail

          if [ -z "$FEED_OWNER_EMAIL" ]; then
            echo "Missing required repository variable: FEED_OWNER_EMAIL" >&2
            exit 1
          fi

          mkdir -p pages
          cp feed/cover.png pages/cover.png
          pwsh scripts/Build-Feed.ps1 \
            -TranscriptDir transcripts \
            -Mp3Dir archive-mp3 \
            -OutputFile pages/rss.xml \
            -RepoOwner "${{ github.repository_owner }}" \
            -RepoName "${{ github.event.repository.name }}" \
            -FeedBaseUrl "https://cloudywing.github.io/software-english-podcast" \
            -OwnerEmail "$FEED_OWNER_EMAIL"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  publish-pages:
    needs: [generate-audio]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
